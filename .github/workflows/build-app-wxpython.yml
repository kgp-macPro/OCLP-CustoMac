name: CI - Build wxPython

on:
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build wxPython
    runs-on: macos-15-intel
    if: github.repository == 'kgp-macPro/OCLP-CustoMac'

    env:
      PYTHONHASHSEED: '0'
      PYTHON_INSTALLER_URL: https://www.python.org/ftp/python/3.14.3/python-3.14.3-macos11.pkg
      PYTHON_INSTALLER_SHA256: 50b709f72cb5ed87d5882901923face981dd657569717761832c36db3bf08238
      PYTHON_FRAMEWORK_SHA256: 131f5211d7a7ec6279abcc2e4b0b97f8559d8eb77d5a28c22771f9ced084360f

      # GitHub Information
      branch: ${{ github.ref }}

      # Analytics
      #ANALYTICS_KEY: ${{ secrets.ANALYTICS_KEY }}
      #ANALYTICS_SITE: ${{ secrets.ANALYTICS_SITE }}

      # App Signing
      #ORG_MAC_DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.ORG_MAC_DEVELOPER_ID_APPLICATION_IDENTITY }}

      # PKG Signing
      #ORG_MAC_DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.ORG_MAC_DEVELOPER_ID_INSTALLER_IDENTITY }}

      # Notarization
      #ORG_MAC_NOTARIZATION_TEAM_ID: ${{ secrets.ORG_MAC_NOTARIZATION_TEAM_ID }}
      #ORG_MAC_NOTARIZATION_APPLE_ID: ${{ secrets.ORG_MAC_NOTARIZATION_APPLE_ID }}
      #ORG_MAC_NOTARIZATION_PASSWORD: ${{ secrets.ORG_MAC_NOTARIZATION_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # - name: Import Application Signing Certificate
      #   uses: dhinakg/import-codesign-certs@master
      #   with:
      #     p12-file-base64: ${{ secrets.ORG_MAC_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
      #     p12-password: ${{ secrets.ORG_MAC_DEVELOPER_ID_APPLICATION_CERT_P12_PASSWORD }}

      # - name: Import Installer Signing Certificate
      #   uses: dhinakg/import-codesign-certs@master
      #   with:
      #     p12-file-base64: ${{ secrets.ORG_MAC_DEVELOPER_ID_INSTALLER_CERT_P12_BASE64 }}
      #     p12-password: ${{ secrets.ORG_MAC_DEVELOPER_ID_INSTALLER_CERT_P12_PASSWORD }}

      # - name: Install Dependencies
      #   run: /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m pip install -r requirements.txt

      # - name: Force Universal2 charset for Python
      #   run: |
      #     /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m pip uninstall -y charset_normalizer
      #     /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m pip download --platform macosx_10_9_universal2 --only-binary=:all: charset-normalizer
      #     /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m pip install charset_normalizer-*-macosx_10_9_universal2.whl

      - name: Stage locked Python.org build interpreter
        run: |
          PYTHON_INSTALLER="$RUNNER_TEMP/python-3.14.3-macos11.pkg"
          PYTHON_PACKAGE_ROOT="$RUNNER_TEMP/python-3.14.3-package"
          PYTHON_FRAMEWORK_PARENT="$RUNNER_TEMP/python-3.14.3"
          PYTHON_BIN="$PYTHON_FRAMEWORK_PARENT/Python.framework/Versions/3.14/bin/python3"
          DYLD_FRAMEWORK_PATH="$PYTHON_FRAMEWORK_PARENT"
          export PYTHON_FRAMEWORK_PARENT PYTHON_BIN DYLD_FRAMEWORK_PATH
          curl --fail --location --retry 3 --output "$PYTHON_INSTALLER" "$PYTHON_INSTALLER_URL"
          printf '%s  %s\n' "$PYTHON_INSTALLER_SHA256" "$PYTHON_INSTALLER" | shasum -a 256 --check
          pkgutil --expand-full "$PYTHON_INSTALLER" "$PYTHON_PACKAGE_ROOT"
          mkdir -p "$PYTHON_FRAMEWORK_PARENT/Python.framework"
          ditto "$PYTHON_PACKAGE_ROOT/Python_Framework.pkg/Payload" "$PYTHON_FRAMEWORK_PARENT/Python.framework"
          test -x "$PYTHON_BIN"
          printf '%s  %s\n' "$PYTHON_FRAMEWORK_SHA256" "$PYTHON_FRAMEWORK_PARENT/Python.framework/Versions/3.14/Python" | shasum -a 256 --check
          test "$(arch -x86_64 "$PYTHON_BIN" -c 'import platform; print(f"{platform.python_version()} {platform.machine()}")')" = "3.14.3 x86_64"
          printf 'PYTHON_FRAMEWORK_PARENT=%s\n' "$PYTHON_FRAMEWORK_PARENT" >> "$GITHUB_ENV"
          printf 'PYTHON_BIN=%s\n' "$PYTHON_BIN" >> "$GITHUB_ENV"
          printf 'DYLD_FRAMEWORK_PATH=%s\n' "$DYLD_FRAMEWORK_PATH" >> "$GITHUB_ENV"

      - name: Create locked build environment
        run: |
          arch -x86_64 "$PYTHON_BIN" -m venv --without-pip .venv-build
          arch -x86_64 .venv-build/bin/python -m ensurepip --upgrade --default-pip
          test "$(arch -x86_64 .venv-build/bin/python -c 'import importlib.metadata; print(importlib.metadata.version("pip"))')" = "25.3"
          PIP_CONFIG_FILE=/dev/null arch -x86_64 .venv-build/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-lock.txt
          arch -x86_64 .venv-build/bin/python -m ci_tooling.build_environment

      - name: Pin source timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Validate source and regressions
        run: |
          .venv-build/bin/python -m unittest discover -s tests
          .venv-build/bin/python -m compileall -q opencore_legacy_patcher ci_tooling tests
          git diff --check
        
      - name: Prepare Assets (--prepare-assets)
        run: >
          .venv-build/bin/python Build-Project.command
          --run-as-individual-steps --reset-dmg-cache
          --prepare-assets

      - name: Prepare Application (--prepare-application)
        run: >
          .venv-build/bin/python Build-Project.command
          --git-branch "${{ env.branch }}"
          --reset-pyinstaller-cache
          --run-as-individual-steps
          --prepare-application

      - name: Prepare Package (--prepare-package)
        run: >
          .venv-build/bin/python Build-Project.command
          --run-as-individual-steps
          --prepare-package

      - name: Validate application and package parity
        run: |
          codesign --verify --deep --strict dist/OpenCore-Patcher.app
          pkgutil --check-signature dist/OpenCore-Patcher.pkg
          pkgutil --check-signature dist/OpenCore-Patcher-Uninstaller.pkg
          pkgutil --expand-full dist/OpenCore-Patcher.pkg package-expanded
          codesign --verify --deep --strict "package-expanded/OpenCore-Patcher.pkg/Payload/Library/Application Support/Dortania/OpenCore-Patcher.app"
          test -z "$(rsync -ainc --delete --omit-dir-times 'dist/OpenCore-Patcher.app/' 'package-expanded/OpenCore-Patcher.pkg/Payload/Library/Application Support/Dortania/OpenCore-Patcher.app/')"

      - name: Upload AutoPkg Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPkg-Assets.pkg
          path: ./dist/AutoPkg-Assets.pkg

      - name: Upload Installation Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher.pkg
          path: ./dist/OpenCore-Patcher.pkg

      - name: Upload Uninstaller Package to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCore-Patcher-Uninstaller.pkg
          path: ./dist/OpenCore-Patcher-Uninstaller.pkg
