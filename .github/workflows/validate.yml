name: CI - Validation

on:
  push:
    paths-ignore: 
      - 'docs/**'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Validate
    runs-on: x86_64_monterey
    if: github.repository_owner == 'dortania'
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: 'x64'
      - name: Install locked dependencies
        run: |
          python3 -m venv .venv-build
          PIP_CONFIG_FILE=/dev/null .venv-build/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-lock.txt
          .venv-build/bin/python -m ci_tooling.build_environment --validation-only
      - name: Validate
        run: .venv-build/bin/python OpenCore-Patcher-GUI.command --validate
