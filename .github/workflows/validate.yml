name: CI - Validation

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate
    runs-on: macos-15-intel
    if: github.repository == 'kgp-macPro/OCLP-CustoMac'
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: 'x64'
      - name: Install locked dependencies
        run: |
          python3 -m venv .venv-build
          PIP_CONFIG_FILE=/dev/null .venv-build/bin/python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes --index-url https://pypi.org/simple -r requirements-lock.txt
          .venv-build/bin/python -m ci_tooling.build_environment --validation-only
      - name: Run complete regression suite
        run: .venv-build/bin/python -m unittest discover -s tests
      - name: Compile validation
        run: .venv-build/bin/python -m compileall -q opencore_legacy_patcher ci_tooling tests
      - name: Source whitespace validation
        run: git diff --check
